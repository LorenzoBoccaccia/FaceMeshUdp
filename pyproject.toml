[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facemesh"
version = "0.1.0"
description = "Pure Python FaceMesh overlay + OpenTrack/FreeTrack app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lorenzo Boccaccia"}]
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.13,<5",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "pyglet>=2.1"
]

[project.optional-dependencies]
dev = [
  "taskipy>=1.14.0",
  "yappi>=1.6.0"
]
release = [
  "cx_Freeze>=8.7"
]

[project.scripts]
facemesh = "facemesh_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.taskipy.tasks]
run = "python -m facemesh_app.main"
build-exe = "python scripts/build_release.py"
dist-zip = "python scripts/make_dist_zip.py"

[tool.cxfreeze]
executables = [{script = "src/facemesh_app/main.py", target_name = "facemesh"}]

[tool.cxfreeze.build_exe]
build_exe = "dist/facemesh"
packages = ["pyglet"]
bin_excludes = ["opencv_videoio_ffmpeg*.dll"]
include_msvcr = true
include_files = [
  ["face_landmarker.task", "face_landmarker.task"],
  ["LICENSE", "LICENSE"],
  ["NOTICE", "NOTICE"]
]
